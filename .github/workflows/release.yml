name: Release standalone CLI

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            artifact: darwin-x64
          - runner: macos-14
            artifact: darwin-arm64
          - runner: ubuntu-latest
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
          - runner: windows-latest
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: securstack-cli
      - name: Checkout private core contracts
        shell: bash
        env:
          BITBUCKET_API_TOKEN: ${{ secrets.SECURSTACK_BITBUCKET_API_TOKEN }}
        run: |
          auth="$(printf 'x-bitbucket-api-token-auth:%s' "$BITBUCKET_API_TOKEN" | base64)"
          git -c http.extraheader="Authorization: Basic $auth" clone https://bitbucket.org/securstack/securstack-core.git securstack-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            securstack-core/package-lock.json
            securstack-cli/package-lock.json
      - name: Build shared public contract
        working-directory: securstack-core
        run: npm ci && npm test && npm run build
      - name: Build and smoke-test standalone executable
        working-directory: securstack-cli
        run: npm ci && npm test && npm run build:binary
      - uses: actions/upload-artifact@v4
        with:
          name: securstack-${{ matrix.artifact }}
          path: securstack-cli/dist/securstack-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      DOWNLOADS_BUCKET: ${{ secrets.SECURSTACK_DOWNLOADS_BUCKET }}
      SECURSTACK_NPM_TOKEN: ${{ secrets.SECURSTACK_NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: securstack-cli
      - name: Checkout private core contracts
        env:
          BITBUCKET_API_TOKEN: ${{ secrets.SECURSTACK_BITBUCKET_API_TOKEN }}
        run: |
          auth="$(printf 'x-bitbucket-api-token-auth:%s' "$BITBUCKET_API_TOKEN" | base64)"
          git -c http.extraheader="Authorization: Basic $auth" clone https://bitbucket.org/securstack/securstack-core.git securstack-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: securstack-cli/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: securstack-*
          path: securstack-cli/dist/release
          merge-multiple: true
      - name: Generate checksums, package-manager metadata and Debian packages
        working-directory: securstack-cli
        run: |
          npm ci
          node scripts/generate-release-manifest.mjs dist/release
          node scripts/render-distribution.mjs dist/release/manifest.json dist/packages
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          ./scripts/package-deb.sh dist/release/securstack-linux-x64 "$version" dist/release
          ./scripts/package-deb.sh dist/release/securstack-linux-arm64 "$version" dist/release
          cp install/install.sh install/install.ps1 dist/release/
          (cd dist/packages/npm && npm pack --pack-destination ../../release)
          tar -C dist/packages -czf "dist/release/securstack-package-metadata-${version}.tar.gz" .
      - name: Publish canonical download directory
        working-directory: securstack-cli
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SECURSTACK_DOWNLOADS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECURSTACK_DOWNLOADS_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SECURSTACK_DOWNLOADS_AWS_REGION }}
        run: |
          version="$(node -p "require('./package.json').version")"
          aws s3 sync dist/release "s3://${DOWNLOADS_BUCKET}/cli/v${version}/" --delete
          aws s3 cp dist/release/latest.txt "s3://${DOWNLOADS_BUCKET}/cli/latest.txt" --cache-control no-cache
          aws s3 cp dist/release/install.sh "s3://${DOWNLOADS_BUCKET}/cli/install.sh" --cache-control no-cache --content-type text/x-shellscript
          aws s3 cp dist/release/install.ps1 "s3://${DOWNLOADS_BUCKET}/cli/install.ps1" --cache-control no-cache --content-type text/plain
      - name: Publish GitHub release
        working-directory: securstack-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/* --generate-notes --verify-tag
      - name: Publish npm compatibility installer when configured
        if: ${{ env.SECURSTACK_NPM_TOKEN != '' && env.DOWNLOADS_BUCKET != '' }}
        working-directory: securstack-cli/dist/packages/npm
        run: |
          npm config set //registry.npmjs.org/:_authToken "$SECURSTACK_NPM_TOKEN"
          test "$(npm whoami --registry https://registry.npmjs.org/)" = "securstack"
          npm publish --access public --registry https://registry.npmjs.org/
