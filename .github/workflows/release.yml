name: Release standalone CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            artifact: darwin-x64
          - runner: macos-14
            artifact: darwin-arm64
          - runner: ubuntu-latest
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
          - runner: windows-latest
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: securstack-cli
      - name: Checkout private core contracts
        shell: bash
        env:
          BITBUCKET_API_TOKEN: ${{ secrets.SECURSTACK_BITBUCKET_API_TOKEN }}
        run: |
          askpass="$(mktemp)"
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '*Username*) printf "%s\\n" "x-bitbucket-api-token-auth" ;;' \
            '*Password*) printf "%s\\n" "$BITBUCKET_API_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$askpass" \
            git clone https://x-bitbucket-api-token-auth@bitbucket.org/securstack/securstack-core.git securstack-core
          rm -f "$askpass"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            securstack-core/package-lock.json
            securstack-cli/package-lock.json
      - name: Build shared public contract
        working-directory: securstack-core
        run: npm ci && npm test && npm run build
      - name: Build and smoke-test standalone executable
        working-directory: securstack-cli
        run: npm ci && npm test && npm run build:binary
      - uses: actions/upload-artifact@v4
        with:
          name: securstack-${{ matrix.artifact }}
          path: securstack-cli/dist/securstack-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      SECURSTACK_NPM_TOKEN: ${{ secrets.SECURSTACK_NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: securstack-cli
      - name: Checkout private core contracts
        env:
          BITBUCKET_API_TOKEN: ${{ secrets.SECURSTACK_BITBUCKET_API_TOKEN }}
        run: |
          askpass="$(mktemp)"
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '*Username*) printf "%s\\n" "x-bitbucket-api-token-auth" ;;' \
            '*Password*) printf "%s\\n" "$BITBUCKET_API_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$askpass" \
            git clone https://x-bitbucket-api-token-auth@bitbucket.org/securstack/securstack-core.git securstack-core
          rm -f "$askpass"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: securstack-cli/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: securstack-*
          path: securstack-cli/dist/release
          merge-multiple: true
      - name: Generate checksums, package-manager metadata and Debian packages
        working-directory: securstack-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          npm ci
          node scripts/generate-release-manifest.mjs dist/release
          node scripts/render-distribution.mjs dist/release/manifest.json dist/packages
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          ./scripts/package-deb.sh dist/release/securstack-linux-x64 "$version" dist/release
          ./scripts/package-deb.sh dist/release/securstack-linux-arm64 "$version" dist/release
          sh ./scripts/package-rpm.sh dist/release/securstack-linux-x64 "$version" dist/release
          sh ./scripts/package-rpm.sh dist/release/securstack-linux-arm64 "$version" dist/release
          cp install/install.sh install/install.ps1 dist/release/
          cp packaging/rpm/install-yum.sh dist/release/
          (cd dist/packages/npm && npm pack --pack-destination ../../release)
          tar -C dist/packages -czf "dist/release/securstack-package-metadata-${version}.tar.gz" .
      - name: Publish canonical download directory on the production server
        continue-on-error: true
        timeout-minutes: 4
        working-directory: securstack-cli
        env:
          DOWNLOADS_SSH_HOST: ${{ secrets.SECURSTACK_DOWNLOADS_SSH_HOST }}
          DOWNLOADS_SSH_PORT: ${{ secrets.SECURSTACK_DOWNLOADS_SSH_PORT }}
          DOWNLOADS_SSH_USER: ${{ secrets.SECURSTACK_DOWNLOADS_SSH_USER }}
          DOWNLOADS_SSH_PRIVATE_KEY: ${{ secrets.SECURSTACK_DOWNLOADS_SSH_PRIVATE_KEY }}
          DOWNLOADS_SSH_KNOWN_HOSTS: ${{ secrets.SECURSTACK_DOWNLOADS_SSH_KNOWN_HOSTS }}
          DOWNLOADS_PATH: ${{ secrets.SECURSTACK_DOWNLOADS_PATH }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          port="${DOWNLOADS_SSH_PORT:-22}"
          remote_path="${DOWNLOADS_PATH:-/srv/securstack/downloads}"
          test -n "$DOWNLOADS_SSH_HOST"
          test -n "$DOWNLOADS_SSH_USER"
          test -n "$DOWNLOADS_SSH_PRIVATE_KEY"
          test -n "$DOWNLOADS_SSH_KNOWN_HOSTS"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$DOWNLOADS_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$remote_path" =~ ^/[A-Za-z0-9._/-]+$ ]]
          test "$remote_path" != "/"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DOWNLOADS_SSH_PRIVATE_KEY" > "$HOME/.ssh/securstack_downloads"
          chmod 600 "$HOME/.ssh/securstack_downloads"
          printf '%s\n' "$DOWNLOADS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          archive="securstack-cli-v${version}-${GITHUB_RUN_ID}.tar.gz"
          tar -C dist/release -czf "/tmp/${archive}" .
          ssh_args=(-i "$HOME/.ssh/securstack_downloads" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp -i "$HOME/.ssh/securstack_downloads" -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "/tmp/${archive}" "${DOWNLOADS_SSH_USER}@${DOWNLOADS_SSH_HOST}:${remote_path}/${archive}"
          ssh "${ssh_args[@]}" "${DOWNLOADS_SSH_USER}@${DOWNLOADS_SSH_HOST}" \
            "set -eu; base='${remote_path}'; version='${version}'; archive='${archive}'; target=\"\$base/cli/v\$version\"; staging=\"\$base/.cli-v\$version-${GITHUB_RUN_ID}\"; test ! -e \"\$target\"; rm -rf \"\$staging\"; mkdir -p \"\$staging\" \"\$base/cli\" \"\$base/rpm/stable/x86_64\" \"\$base/rpm/stable/aarch64\"; tar -xzf \"\$base/\$archive\" -C \"\$staging\"; mv \"\$staging\" \"\$target\"; cp \"\$target/latest.txt\" \"\$base/cli/latest.txt\"; cp \"\$target/install.sh\" \"\$base/cli/install.sh\"; cp \"\$target/install.ps1\" \"\$base/cli/install.ps1\"; cp \"\$target/install-yum.sh\" \"\$base/rpm/install.sh\"; cp \"\$target\"/securstack-*-1.x86_64.rpm \"\$base/rpm/stable/x86_64/\"; cp \"\$target\"/securstack-*-1.aarch64.rpm \"\$base/rpm/stable/aarch64/\"; if command -v createrepo_c >/dev/null 2>&1; then createrepo_c --update \"\$base/rpm/stable/x86_64\" && createrepo_c --update \"\$base/rpm/stable/aarch64\"; elif command -v createrepo >/dev/null 2>&1; then createrepo --update \"\$base/rpm/stable/x86_64\" && createrepo --update \"\$base/rpm/stable/aarch64\"; else echo 'Warning: createrepo_c not available; RPM files copied without repository metadata' >&2; fi; rm -f \"\$base/\$archive\""
          rm -f "/tmp/${archive}" "$HOME/.ssh/securstack_downloads"

          test "$(curl --fail --silent --show-error https://downloads.securstack.io/cli/latest.txt)" = "$version"
          curl --fail --silent --show-error --head \
            "https://downloads.securstack.io/cli/v${version}/manifest.json" >/dev/null
          curl --fail --silent --show-error --head \
            "https://downloads.securstack.io/rpm/install.sh" >/dev/null
      - name: Publish GitHub release
        working-directory: securstack-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi
          gh release create "$tag" dist/release/* --generate-notes --target "${GITHUB_SHA}"
      - name: Publish npm compatibility installer when configured
        if: ${{ env.SECURSTACK_NPM_TOKEN != '' }}
        working-directory: securstack-cli/dist/packages/npm
        run: |
          npm config set //registry.npmjs.org/:_authToken "$SECURSTACK_NPM_TOKEN"
          test "$(npm whoami --registry https://registry.npmjs.org/)" = "securstack"
          npm publish --access public --registry https://registry.npmjs.org/
